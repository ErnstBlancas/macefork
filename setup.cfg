[metadata]
name = macefork
version = attr: macefork.__version__
short_description = MACE - Fast and accurate machine learning interatomic potentials with higher order equivariant message passing.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ACEsuit/mace
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Operating System :: OS Independent
    License :: OSI Approved :: MIT License

[options]
packages = find:
python_requires = >=3.10
install_requires =
    torch>=1.12
    e3nn==0.4.4
    numpy
    opt_einsum
    ase
    torch-ema
    prettytable
    matscipy
    h5py
    torchmetrics
    python-hostlist
    configargparse
    GitPython
    pyYAML
    tqdm
    lmdb
    orjson
    # for plotting:
    matplotlib
    pandas
    # for testing:
    pytest

[options.packages.find]
# Ship only the macefork package: a bare `find:` also picks up the top-level
# `tests` and `scripts` packages, which upstream mace-torch installs too, so the
# two distributions would overwrite each other in site-packages.
include =
    macefork
    macefork.*

[options.entry_points]
console_scripts =
    macefork_active_learning_md  =  macefork.cli.active_learning_md:main
    macefork_create_lammps_model  =  macefork.cli.create_lammps_model:main
    macefork_eval_configs  =  macefork.cli.eval_configs:main
    macefork_plot_train  =  macefork.cli.plot_train:main
    macefork_run_train  =  macefork.cli.run_train:main
    macefork_prepare_data  =  macefork.cli.preprocess_data:main
    macefork_finetuning_select = macefork.cli.fine_tuning_select:main
    macefork_convert_device  =  macefork.cli.convert_device:main
    macefork_select_head =  macefork.cli.select_head:main
    macefork_e3nn_cueq = macefork.cli.convert_e3nn_cueq:main
    macefork_cueq_to_e3nn = macefork.cli.convert_cueq_e3nn:main
    macefork_polar_density_cube = macefork.cli.polar_density_cube:main

[options.extras_require]
wandb = wandb
fpsample = fpsample
test =
    pytest
    pytest-benchmark
    pytest-cov
    pytest-split
    pytest-timeout
    pytest-xdist
dev =
    black
    isort
    mypy
    pre-commit
    pytest
    pytest-benchmark
    pytest-cov
    pytest-split
    pytest-timeout
    pytest-xdist
    pylint==4.0.6
schedulefree = schedulefree
magnetic =
    sphericart-torch>=2.0
    torch-geometric
torchsim =
    torch-sim-atomistic; python_version >= "3.12"
# The cueq ops wheels are capped below 0.11. The 0.11 ops binaries link a newer
# cuBLAS than they declare (metadata says nvidia-cublas>=12.5.0), so pip can
# satisfy them with the cuBLAS that torch pins -- 13.1.1.3 via cuda-toolkit --
# and the extension then fails to import. cuequivariance falls back to
# SegmentedPolynomialNaive on that failure with only a warning, which is why an
# ops release surfaced as an AttributeError in every cueq test at once.
# Upper bounds rather than == so patch releases still flow and pip keeps room to
# resolve. Revisit when the ops metadata is fixed or torch moves its cuBLAS pin.
cueq = cuequivariance-torch>=0.2.0,<0.12
oeq = openequivariance
# No cueq-cuda-11. Its ops stream ended at 0.5.1 in June 2025, it publishes no
# wheel past cp312, and nothing pins the frontend to match: `[cueq,cueq-cuda-11]`
# resolved a 0.11 cuequivariance-torch against 0.5.1 kernels, six minor versions
# apart, and offered that as the supported install. cueq-cuda-12 is the route for
# a CUDA 11 host, since CUDA 12 builds run on those drivers.
cueq-cuda-12 = cuequivariance-ops-torch-cu12>=0.2.0,<0.11
# cu13 ops start at 0.7.0; the cu12 floor above predates that split.
cueq-cuda-13 = cuequivariance-ops-torch-cu13>=0.7.0,<0.11
